<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Filter Bubble Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 450px;
      min-height: 300px;
      background: #fafafa;
      color: #333;
      line-height: 1.4;
      margin: 0;
      padding: 20px;
    }
    .header {
      background: linear-gradient(135deg, #ff0000, #cc0000);
      color: white;
      padding: 20px;
      text-align: center;
      margin: -20px -20px 20px -20px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>YouTube Filter Bubble</h1>
    <p>Track your recommendation patterns</p>
  </div>

  <div id="loading">
    <p>Loading your data...</p>
  </div>

  <div id="no-data" class="hidden">
    <h3>No data yet</h3>
    <p>Visit YouTube.com to start tracking your recommendations</p>
  </div>

  <script>
    console.log('Popup script loaded');
    
    // Simple test without Chrome API calls
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('no-data').classList.remove('hidden');
    }, 1000);
  </script>
</body>
</html>
